<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <style>
    /* Genel Sayfa Sıfırlama */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #ffffff;
      color: #202124;
    }

    a {
      text-decoration: none;
      color: rgba(0, 0, 0, 0.87);
      font-size: 14px;
    }

    a:hover {
      text-decoration: underline;
    }

    /* 1. ÜST HEADER ALANI */
    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 15px 20px;
      gap: 15px;
    }

    .btn-login {
      background-color: #1a73e8;
      color: white;
      padding: 8px 23px;
      border-radius: 4px;
      font-weight: 500;
    }

    .btn-login:hover {
      background-color: #1557b0;
      text-decoration: none;
    }

    /* 2. ORTA ARAMA ALANI */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-top: -50px; /* Dikeyde tam göz hizasına ortalamak için */
    }

    /* Renkli Google Logosu */
    .logo {
      font-size: 90px;
      font-weight: bold;
      letter-spacing: -3px;
      margin-bottom: 20px;
      user-select: none;
    }

    .g-blue { color: #4285F4; }
    .g-red { color: #EA4335; }
    .g-yellow { color: #FBBC05; }
    .g-green { color: #34A853; }

    /* Arama Çubuğu */
    .search-box {
      width: 100%;
      max-width: 584px;
      height: 46px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .search-box:hover, .search-box:focus-within {
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
      border-color: rgba(223, 225, 229, 0);
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      margin: 0 10px;
    }

    /* Arama ve Kendimi Şanslı Hissediyorum Butonları */
    .buttons {
      margin-top: 25px;
      display: flex;
      gap: 12px;
    }

    .btn-google {
      background-color: #f8f9fa;
      border: 1px solid #f8f9fa;
      border-radius: 4px;
      color: #3c4043;
      font-size: 14px;
      padding: 10px 16px;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-google:hover {
      border-color: #dadce0;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
      color: #202124;
    }

    /* 3. ALT FOOTER ALANI */
    footer {
      background-color: #f2f2f2;
      color: #70757a;
    }

    .footer-location {
      padding: 12px 30px;
      border-bottom: 1px solid #dadce0;
      font-size: 15px;
    }

    .footer-links {
      display: flex;
      justify-content: space-between;
      padding: 12px 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .footer-links div {
      display: flex;
      gap: 20px;
    }

    .footer-links a {
      color: #70757a;
    }
  </style>
</head>
<body>

  <!-- Üst Sağ Menü -->
  <header>
    <a href="#">Gmail</a>
    <a href="#">Görseller</a>
    <a href="#" class="btn-login">Oturum açın</a>
  </header>

  <!-- Orta Google Arama Alanı -->
  <main>
    <div class="logo">
      <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
    </div>

    <form class="search-box">
      <!-- Arama Büyüteç İkonu (SVG) -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#9aa0a6">
        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      
      <input type="text" class="search-input" autofocus autofocus />
      
      <!-- Mikrofon İkonu (SVG) -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#4285f4" style="cursor: pointer;">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </form>

    <div class="buttons">
      <button class="btn-google">Google'da Ara</button>
      <button class="btn-google">Kendimi Şanslı Hissediyorum</button>
    </div>
  </main>

  <!-- Alt Bilgi (Footer) -->
  <footer>
    <div class="footer-location">Türkiye</div>
    <div class="footer-links">
      <div>
        <a href="#">Hakkında</a>
        <a href="#">Reklam</a>
        <a href="#">İşletme</a>
        <a href="#">Arama nasıl çalışır?</a>
      </div>
      <div>
        <a href="#">Gizlilik</a>
        <a href="#">Şartlar</a>
        <a href="#">Ayarlar</a>
      </div>
    </div>
  </footer>

</body>
</html>
