<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Özel CSS -->
    <link rel="stylesheet" href="instagram.css">
</head>
<body>

    <!--. Navbar: -->
    <nav class="navbar navbar-expand navbar-light bg-white border-bottom fixed-top">
        <div class="container-fluid p-0">
            
            <!-- 3. Logo  -->
            <a class="navbar-brand logo" href="#">
                <img src="https://www.instagram.com/static/images/web/mobile_nav_type_logo.png/73ae72d0838d.png" alt="Instagram" height="29">
            </a>
            <!--  Arama Kısmı: -->
            <div class="d-flex align-items-center ms-5">
                <input type="text" class="form-control search-input form-control-sm" placeholder="Ara" style="width: 215px; background-color: #fafafa;">
            </div>

            <!-- Sağ Üst Menü:  -->
            <div class="ms-5 mt-2 d-none d-sm-block ms-auto me-5 fs-5">
                <i class="fa-solid fa-house me-3"></i>
                <i class="fa-paper-plane me-3"></i>
                <i class="fa-regular fa-compass me-3"></i>
                <i class="fa-regular fa-heart me-3"></i>
                <i class="fa-regular fa-user me-3"></i>
            </div>

        </div>
    </nav>

    <!-- Ana Konteyner -->
    <div class="container mt-3">
        <div class="row">

            <!-- 9 & 11. İçerik Alanı:-->
            <div class="col-12 col-sm-6 col-md-6 col-lg-6 col-xl-6 offset-md-4 mt-2">
                
                
                <div class="card mb-3 middlearea p-2 bg-white border">
                    <div class="d-flex justify-content-start overflow-auto align-items-center">
                        
                       
                        <div class="d-flex flex-column align-items-center me-3">
                            <img src="https://picsum.photos/60/60?random=1" class="rounded-circle border border-danger p-1" width="60" height="60">
                            <span class="small mt-1">kullanici1</span>
                        </div>
                        <div class="d-flex flex-column align-items-center me-3">
                            <img src="https://picsum.photos/60/60?random=2" class="rounded-circle border border-danger p-1" width="60" height="60">
                            <span class="small mt-1">kullanici2</span>
                        </div>
                        <div class="d-flex flex-column align-items-center me-3">
                            <img src="https://picsum.photos/60/60?random=3" class="rounded-circle border border-danger p-1" width="60" height="60">
                            <span class="small mt-1">kullanici3</span>
                        </div>

                    </div>
                </div>

                <!-- Gönderi Kartı -->
                <div class="card mb-4 bg-white border">
                    
                    
                    <div class="card-header bg-white d-flex align-items-center border-0">
                        <img src="https://picsum.photos/40/40?random=4" class="rounded-circle me-2" width="32" height="32">
                        <span class="fw-bold small">kodluyoruz</span>
                        <i class="fa-solid fa-ellipsis ms-auto"></i>
                    </div>

                   
                    <img src="https://picsum.photos/600/600?random=5" class="card-img-top" alt="Post">

                   
                    <div class="card-body bg-white p-2">
                        <div class="d-flex align-items-center mb-2 fs-5">
                            
                            <button class="btn border-0 p-1"><i class="fa-regular fa-heart"></i></button>
                            <button class="btn border-0 p-1"><i class="fa-regular fa-comment"></i></button>
                            <button class="btn border-0 p-1"><i class="fa-paper-plane"></i></button>
                            
                         
                            <button class="btn border-0 p-1 ms-auto"><i class="fa-regular fa-bookmark"></i></button>
                        </div>
                        <p class="card-text mb-1"><strong>1.250 beğenme</strong></p>
                        <p class="card-text"><strong>kodluyoruz</strong> Bootstrap ile Instagram clone çalışması! 🚀</p>
                    </div>

                    
                    <div class="card-footer bg-white border-top p-2">
                        <div class="d-flex align-items-center">
                            <input type="text" class="form-control border-0 p-0" placeholder="Yorum ekle..." style="box-shadow: none;">
                            
                            <button class="btn btn-link text-primary text-decoration-none fw-bold p-0 ms-auto">Paylaş</button>
                        </div>
                    </div>

                </div>

            </div>

            
            <div class="col-md-3 d-none d-lg-block stickysidebar">
                <div class="card rightpanel p-2">
                    
                   
                    <div class="d-flex align-items-center mb-3">
                        <img src="https://picsum.photos/50/50?random=6" class="rounded-circle me-2" width="50" height="50">
                        <div>
                            <div class="fw-bold small">kullanici_adi</div>
                            <div class="text-muted small">Ad Soyad</div>
                        </div>
                    </div>

                   
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="text-muted fw-bold small">Senin İçin Öneriler</span>
                        
                        <a href="#" class="text-dark fw-bold text-decoration-none extra-small ms-auto" style="font-size: 12px;">Tümünü Gör</a>
                    </div>

                    
                    <div class="d-flex align-items-center mb-2">
                        <img src="https://picsum.photos/40/40?random=7" class="rounded-circle me-2" width="32" height="32">
                        <div>
                            <div class="fw-bold small">yeni_kullanici</div>
                            <div class="text-muted extra-small" style="font-size: 11px;">Instagram'da yeni</div>
                        </div>
                        
                        <a href="#" class="text-primary fw-bold text-decoration-none ms-auto" style="font-size: 12px;">Takip Et</a>
                    </div>

                </div>
            </div>

        </div>
    </div>

</body>
</html>
